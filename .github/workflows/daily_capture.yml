name: Tempest Daily Capture

on:
  schedule:
    # GitHub cron is ALWAYS UTC and has no DST handling, but the US market
    # runs on New York local time. A fixed UTC cron drifts an hour when the
    # US leaves EDT (1 Nov 2026): 13:30 UTC becomes 08:30 ET, an hour BEFORE
    # the open, screening a market with no regular-session bars.
    # Fix: schedule BOTH candidate UTC times per ET target; the ET gate below
    # skips the wrong-season twin so exactly one fires year-round.
    # Paper trading now polls every 5 minutes from LOCAL cron (see
    # scripts/cron_paper.sh). GitHub's scheduler is queued, not guaranteed,
    # and routinely drifts 5-30 minutes under load - unusable for a strategy
    # whose signals live for a handful of bars. These runs remain only for the
    # daily screen/backtest evidence capture.
    - cron: "30 13 * * 1-5"   # 09:30 ET open        (EDT)
    - cron: "30 14 * * 1-5"   # 09:30 ET open        (EST)
    - cron: "30 19 * * 1-5"   # 15:30 ET near-close  (EDT)
    - cron: "30 20 * * 1-5"   # 15:30 ET near-close  (EST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check ET trading window
        id: window
        if: github.event_name == 'schedule'
        run: |
          ET_HHMM=$(TZ=America/New_York date +%H:%M)
          ET_DOW=$(TZ=America/New_York date +%u)
          echo "Now in New York: $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z') (dow=$ET_DOW)"
          if [ "$ET_DOW" -gt 5 ]; then
            echo "Weekend in ET - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$ET_HHMM" in
            09:3*|15:3*) echo "In an intended ET window."; echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Off-window ($ET_HHMM ET) - the other season's cron. Skipping."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout
        if: steps.window.outputs.run != 'false'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.window.outputs.run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.window.outputs.run != 'false'
        run: python3 -m pip install -r requirements.txt

      - name: Restore localdata cache
        if: steps.window.outputs.run != 'false'
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: tempest-localdata-${{ github.run_id }}
          restore-keys: |
            tempest-localdata-

      - name: Run daily capture (screen + backtest)
        if: steps.window.outputs.run != 'false'
        run: bash scripts/capture_daily.sh

      - name: Run paper trade (Alpaca PAPER only)
        id: paper
        if: steps.window.outputs.run != 'false' && vars.TEMPEST_CI_PAPER == '1'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TEMPEST_PAPER: "1"
        run: |
          if [ -z "${ALPACA_API_KEY}" ] || [ -z "${ALPACA_SECRET_KEY}" ]; then
            echo "Alpaca secrets not set - skipping paper trade."
            echo "paper_exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          PYTHONPATH=src python3 scripts/paper_trade.py
          code=$?
          set -e
          echo "paper_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error::paper trade exited $code - see localdata/paper_status.csv"
          fi
          exit 0

      - name: Commit paper-trade journal
        if: steps.window.outputs.run != 'false'
        run: bash scripts/commit_evidence.sh "paper trade journal"

      - name: Save localdata cache
        if: steps.window.outputs.run != 'false'
        uses: actions/cache/save@v4
        with:
          path: localdata
          key: tempest-localdata-${{ github.run_id }}

      - name: Fail run if paper trade failed
        if: steps.window.outputs.run != 'false' && steps.paper.outputs.paper_exit != '' && steps.paper.outputs.paper_exit != '0'
        run: |
          echo "Paper trade exited ${{ steps.paper.outputs.paper_exit }} - authentication or broker error."
          echo "Inspect localdata/paper_status.csv for the stage that failed."
          exit 1
