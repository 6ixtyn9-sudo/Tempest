name: Tempest Daily Capture

on:
  workflow_dispatch:

concurrency:
  group: tempest-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check ET trading window
        id: window
        run: |
          ET_HHMM=$(TZ=America/New_York date +%H:%M)
          ET_DOW=$(TZ=America/New_York date +%u)
          echo "Now in New York: $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z') (dow=$ET_DOW)"
          if [ "$ET_DOW" -gt 5 ]; then
            echo "Weekend in ET - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$ET_HHMM" in
            09:3*|15:3*) echo "In an intended ET window."; echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Off-window ($ET_HHMM ET) - the other season's cron. Skipping."; echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: python3 -m pip install -r requirements.txt

      - name: Restore localdata cache
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: tempest-localdata-${{ github.run_id }}
          restore-keys: |
            tempest-localdata-

      - name: Run daily capture (screen + backtest)
        if: steps.window.outputs.run == 'true'
        run: bash scripts/capture_daily.sh

      - name: Run paper trade (Alpaca PAPER only)
        id: paper
        if: steps.window.outputs.run == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TEMPEST_PAPER: "1"
          # Research probe (2026-08-14). The 90-day sweep proved every
          # configuration with a stop floor <= 0.5% loses money, and the
          # live effective floor WAS 50 bps. Configs at >= 1% showed
          # consistently positive means but never reached significance,
          # and they cannot: they are nested subsets of the same 792
          # sessions, so re-testing that data is survivorship analysis.
          # 200 bps points paper trading at the untested region to
          # generate genuinely OUT-OF-SAMPLE evidence. This is NOT an
          # adoption of 2% as a parameter -- it is choosing where to
          # aim the sensor. Expect far fewer fills (backtest n fell
          # 111 -> 15 across this range). Remove to revert to 50 bps.
          TEMPEST_MIN_RISK_BPS: "200"
        run: |
          if [ -z "${ALPACA_API_KEY}" ] || [ -z "${ALPACA_SECRET_KEY}" ]; then
            echo "Alpaca secrets not set - skipping paper trade."
            echo "paper_exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          PYTHONPATH=src python3 scripts/paper_trade.py
          code=$?
          set -e
          echo "paper_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error::paper trade exited $code - see localdata/paper_status.csv"
          fi
          exit 0

      - name: Commit paper-trade journal
        if: steps.window.outputs.run == 'true'
        run: bash scripts/commit_evidence.sh "paper trade journal"

      - name: Save localdata cache
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: localdata
          key: tempest-localdata-${{ github.run_id }}

      - name: Fail run if paper trade failed
        if: steps.window.outputs.run == 'true' && steps.paper.outputs.paper_exit != '' && steps.paper.outputs.paper_exit != '0'
        run: |
          echo "Paper trade exited ${{ steps.paper.outputs.paper_exit }} - authentication or broker error."
          echo "Inspect localdata/paper_status.csv for the stage that failed."
          exit 1
