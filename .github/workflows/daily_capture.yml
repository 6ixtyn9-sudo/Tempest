name: Tempest Daily Capture

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 13:30 UTC = 09:30 ET (open) - screen + watch
    - cron: "30 17 * * 1-5"   # 17:30 UTC = 13:30 ET (midday) - entries
    - cron: "30 19 * * 1-5"   # 19:30 UTC = 15:30 ET (near close) - exits + log
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Restore localdata cache
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: tempest-localdata-${{ github.run_id }}
          restore-keys: |
            tempest-localdata-

      - name: Run daily capture (screen + backtest)
        run: bash scripts/capture_daily.sh

      - name: Run paper trade (Alpaca PAPER only)
        if: ${{ secrets.ALPACA_API_KEY != '' && secrets.ALPACA_SECRET_KEY != '' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TEMPEST_PAPER: "1"
        run: |
          PYTHONPATH=src python3 scripts/paper_trade.py || echo "paper trade failed (non-fatal for capture)"

      - name: Save localdata cache
        uses: actions/cache/save@v4
        with:
          path: localdata
          key: tempest-localdata-${{ github.run_id }}
