name: Tempest Paper Poll

on:
  workflow_dispatch:

concurrency:
  group: tempest-paper
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check ET trading window
        id: window
        run: |
          ET_HHMM=$(TZ=America/New_York date +%H%M)
          ET_DOW=$(TZ=America/New_York date +%u)
          echo "New York: $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z') dow=$ET_DOW"
          if [ "$ET_DOW" -gt 5 ]; then
            echo "Weekend in ET - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$((10#$ET_HHMM))" -lt 930 ] || [ "$((10#$ET_HHMM))" -gt 1600 ]; then
            echo "Outside 09:30-16:00 ET (now $ET_HHMM) - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "In the RTH window."
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: python3 -m pip install -r requirements.txt

      - name: Restore localdata cache
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: localdata
          key: tempest-localdata-${{ github.run_id }}
          restore-keys: |
            tempest-localdata-

      - name: Run paper trade (Alpaca PAPER only)
        id: paper
        if: steps.window.outputs.run == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TEMPEST_PAPER: "1"
          # Research probe (2026-08-14). The 90-day sweep proved every
          # configuration with a stop floor <= 0.5% loses money, and the
          # live effective floor WAS 50 bps. Configs at >= 1% showed
          # consistently positive means but never reached significance,
          # and they cannot: they are nested subsets of the same 792
          # sessions, so re-testing that data is survivorship analysis.
          # 200 bps points paper trading at the untested region to
          # generate genuinely OUT-OF-SAMPLE evidence. This is NOT an
          # adoption of 2% as a parameter -- it is choosing where to
          # aim the sensor. Expect far fewer fills (backtest n fell
          # 111 -> 15 across this range). Remove to revert to 50 bps.
          TEMPEST_MIN_RISK_BPS: "200"
          # Exit probe (2026-08-14). At a 2% floor the 90-day exit mix
          # was 6 targets / 3 stops: two thirds of trades hit exactly 2R
          # and stopped, the signature of a truncating target. Sweeping
          # RR at constant 66.7% win rate gave 2.0 -> +4.37%/trade and
          # 3.0 -> +7.88%; win rate only degraded at 4.0. UNPROVEN
          # (n=9, nested, CI spans zero) -- this gathers out-of-sample
          # evidence. Unlike every other knob, RR does NOT reduce trade
          # count: it moves the exit, not the entry gate.
          TEMPEST_RR_TARGET: "3.0"
        run: |
          if [ -z "${ALPACA_API_KEY}" ] || [ -z "${ALPACA_SECRET_KEY}" ]; then
            echo "Alpaca secrets not set - skipping paper trade."
            echo "paper_exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          PYTHONPATH=src python3 scripts/paper_trade.py
          code=$?
          set -e
          echo "paper_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error::paper trade exited $code - see localdata/paper_status.csv"
          fi
          exit 0

      - name: Commit Tempest evidence
        if: steps.window.outputs.run == 'true'
        run: bash scripts/commit_evidence.sh "Tempest paper poll"

      - name: Save localdata cache
        if: steps.window.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: localdata
          key: tempest-localdata-${{ github.run_id }}

      - name: Fail run if Tempest paper trade failed
        if: steps.window.outputs.run == 'true' && steps.paper.outputs.paper_exit != '' && steps.paper.outputs.paper_exit != '0'
        run: |
          echo "Tempest paper trade exited ${{ steps.paper.outputs.paper_exit }}."
          echo "Inspect localdata/paper_status.csv for the failing stage."
          exit 1
