[project]
name = "tempest"
version = "0.1.0"
description = "US microcap momentum research lab — screen, backtest, validate, discover"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.2.6",
  "pyarrow==24.0.0",
  "yfinance==1.5.1",
  "python-dotenv==1.2.2",
  "requests==2.33.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
